name: Mirror Ascend RDMA DP Image

on:
  # 允许你在 Actions 页面手动点击运行
  workflow_dispatch:
  # 当推送形如 v1.0.0 的 tag 时自动触发，用于生成 Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 允许创建 Release 和上传附件
  packages: write  # 允许推送镜像到 GHCR

jobs:
  mirror-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: string
        run: |
          # GHCR 要求镜像路径全小写，处理 Github 用户名可能包含大写字母的情况
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, Tag and Push Image
        env:
          SRC_IMAGE: swr.cn-south-1.myhuaweicloud.com/ascendhub/k8s-rdma-shared-dp:v26.2.0-openeuler24.03-arm64
          DST_IMAGE: ghcr.io/${{ steps.string.outputs.owner }}/k8s-rdma-shared-dp:v26.2.0-openeuler24.03-arm64
        run: |
          echo "⬇️ Pulling image: $SRC_IMAGE"
          docker pull --platform linux/arm64 $SRC_IMAGE
          
          echo "🏷️ Tagging image: $DST_IMAGE"
          docker tag $SRC_IMAGE $DST_IMAGE
          
          echo "⬆️ Pushing image to GHCR"
          docker push $DST_IMAGE

      - name: Generate K8s Deployment YAML
        env:
          DST_IMAGE: ghcr.io/${{ steps.string.outputs.owner }}/k8s-rdma-shared-dp:v26.2.0-openeuler24.03-arm64
        run: |
          # 这里生成一个标准的 DaemonSet 部署文件作为 Release 附件
          # 注意：实际生产使用请根据华为官方文档配置 volumeMounts 和 config.json
          cat <<EOF > k8s-rdma-shared-dp.yaml
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: k8s-rdma-shared-dp
            namespace: kube-system
            labels:
              app: k8s-rdma-shared-dp
          spec:
            selector:
              matchLabels:
                app: k8s-rdma-shared-dp
            template:
              metadata:
                labels:
                  app: k8s-rdma-shared-dp
              spec:
                hostNetwork: true
                hostPID: true
                containers:
                - name: k8s-rdma-shared-dp
                  image: ${DST_IMAGE}
                  imagePullPolicy: IfNotPresent
                  securityContext:
                    privileged: true
                  volumeMounts:
                  - name: dev
                    mountProps: 
                    mountPath: /dev
                volumes:
                - name: dev
                  hostPath:
                    path: /dev
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 昇腾 RDMA Shared Device Plugin (ARM64)
            
            该版本已同步至 GitHub Container Registry (GHCR)。
            
            **拉取命令：**
            ```bash
            docker pull ghcr.io/${{ steps.string.outputs.owner }}/k8s-rdma-shared-dp:v26.2.0-openeuler24.03-arm64
            ```
            
            **适用架构：** `linux/arm64` (适用于昇腾 ARM 服务器)
            
            **部署说明：**
            请下载下方的 `k8s-rdma-shared-dp.yaml` 文件，并根据实际集群环境修改后执行部署：
            ```bash
            kubectl apply -f k8s-rdma-shared-dp.yaml
            ```
          files: |
            k8s-rdma-shared-dp.yaml
